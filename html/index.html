<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="leaderboard.js" defer></script>
</head>
<body>
<title>Sphere</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed canvas; quiet HUD pinned to the corners, the sphere owns the middle. */
  :root {
    --bg: #E9E7F0;
    --bg-deep: #DAD6E6;
    --fg: #1F1B2E;
    --muted: #6B6580;
    --sphere: #3B5BDB;
    --sphere-hi: #C9D4FF;
    --strain: #E5483A;
    --socket: #BDB7CF;
    --ice: #8FCBE6;
    --ice-edge: #3E8FB8;
    --flame: #F2701E;
    --flame-hot: #FFCE4A;
    --font-display: "Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15131D; --bg-deep: #0E0C14; --fg: #ECE9F5; --muted: #8E88A6;
      --sphere: #6E8BFF; --sphere-hi: #E3E9FF; --strain: #FF6F5C; --socket: #34304A; --ice: #A9DDF2; --ice-edge: #E4F6FF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15131D; --bg-deep: #0E0C14; --fg: #ECE9F5; --muted: #8E88A6;
    --sphere: #6E8BFF; --sphere-hi: #E3E9FF; --strain: #FF6F5C; --socket: #34304A; --ice: #A9DDF2; --ice-edge: #E4F6FF;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; outline: none; }
  #stage.grabbing { cursor: grabbing; }
  #stage:focus-visible { box-shadow: inset 0 0 0 3px var(--sphere); }

  .hud {
    position: fixed; left: 0; right: 0; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .hud.top { top: 0; padding-block: calc(16px + env(safe-area-inset-top, 0px)) 0; }
  .hud.bottom {
    bottom: 0; padding-block: 0 calc(18px + env(safe-area-inset-bottom, 0px));
    flex-direction: column; align-items: center; gap: 10px; text-align: center;
  }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(18px, 3.2vw, 26px); letter-spacing: -0.01em; line-height: 1;
  }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; max-width: 30ch; text-wrap: balance; }
  .stats { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
  .stat span { white-space: nowrap; }
  .stat { text-align: right; }
  .stat b { display: block; font-family: var(--font-data); font-weight: 500; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .toggles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  button.toggle {
    pointer-events: auto; font: 500 12px var(--font-data); color: var(--fg);
    background: transparent; border: 1px solid var(--socket); border-radius: 999px;
    padding: 7px 12px; cursor: pointer; letter-spacing: 0.04em;
  }
  button.toggle[aria-pressed="false"] { color: var(--muted); }
  button.toggle:hover { border-color: var(--muted); }
  button.toggle:disabled { cursor: not-allowed; opacity: .55; }
  button.toggle:focus-visible { outline: 2px solid var(--sphere); outline-offset: 2px; }

  #readout {
    font-family: var(--font-data); font-size: 13px; color: var(--muted); min-height: 1.4em;
    font-variant-numeric: tabular-nums; transition: color .3s;
  }
  #readout.hit { color: var(--fg); }
  #readout strong { font-weight: 500; color: var(--strain); }
  .history { display: flex; gap: 6px; align-items: flex-end; height: 34px; }
  .history i {
    display: block; width: 10px; border-radius: 3px 3px 1px 1px;
    background: color-mix(in srgb, var(--sphere) calc(100% - var(--r) * 1%), var(--strain));
    height: calc(4px + var(--r) * 0.3px); opacity: .85;
  }
  .history i:last-child { opacity: 1; outline: 1px solid var(--fg); outline-offset: 2px; }
  .hint { font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) { .sub { display: none; } .stat b { font-size: 18px; } .stats { gap: 10px; } .stat span { font-size: 10px; letter-spacing: 0.04em; } }
</style>

<canvas id="stage" tabindex="0" aria-label="Sphere in its socket. Drag it away from the center, or hold the arrow keys, until it breaks free."></canvas>

<div class="hud top">
  <div>
    <h1>Sphere</h1>
    <p class="sub">Pull the sphere out of its socket. Every new sphere grips with a different strength.</p>
  </div>
  <div class="stats">
    <div class="stat"><b id="form">–</b><span>perfect · last 20</span></div>
    <div class="stat"><b id="score">0</b><span>score</span></div>
    <div class="stat"><b id="count">0</b><span>freed</span></div>
    <div class="toggles">
      <button id="sound" class="toggle" type="button" aria-pressed="true">SOUND ON</button>
      <button id="vibe" class="toggle" type="button" aria-pressed="true">VIBRATION ON</button>
    </div>
  </div>
</div>

<div class="hud bottom">
  <div class="history" id="history" aria-label="Resistance of recent spheres"></div>
  <div id="readout" aria-live="polite"></div>
  <div class="hint" id="hint">Grab the sphere and pull. Aim it at a corner for points.</div>
</div>

<script>
(() => {
  const cv = document.getElementById('stage');
  const ctx = cv.getContext('2d');
  const $count = document.getElementById('count');
  const $score = document.getElementById('score');
  const $form = document.getElementById('form');
  const $readout = document.getElementById('readout');
  const $history = document.getElementById('history');
  const $hint = document.getElementById('hint');
  const $sound = document.getElementById('sound');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, radius = 40, minDim = 400;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2; cy = H / 2 + 10;
    minDim = Math.min(W, H);
    radius = Math.max(26, Math.min(52, minDim * 0.075));
  }
  addEventListener('resize', resize); resize();

  // ---- colors from tokens ----
  const css = getComputedStyle(document.documentElement);
  const hex = s => { s = s.trim().replace('#', ''); if (s.length === 3) s = [...s].map(c => c + c).join(''); const n = parseInt(s, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  let C = {};
  function readColors() { for (const k of ['bg', 'bg-deep', 'fg', 'muted', 'sphere', 'sphere-hi', 'strain', 'socket', 'ice', 'ice-edge', 'flame', 'flame-hot']) C[k] = hex(css.getPropertyValue('--' + k) || '#888'); }
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(readColors, 0));
  new MutationObserver(() => setTimeout(readColors, 0)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hsl = (h, s, l) => {
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [f(0), f(8), f(4)].map(v => Math.round(v * 255));
  };
  // the current sphere's colors, lighter on a dark background so it keeps its contrast
  function sphereColors() {
    const dark = (C.bg[0] * 0.299 + C.bg[1] * 0.587 + C.bg[2] * 0.114) < 128;
    return {
      body: hsl(S.hue, S.sat, dark ? 0.66 : 0.5),
      hi: hsl(S.hue, S.sat * 0.6, dark ? 0.92 : 0.86),
    };
  }

  // ---- game state ----
  const S = { state: 'spawning', R: 0, breakPull: 0, gain: 1, follow: .3, spring: .1,
    pos: { x: 0, y: 0 }, vel: { x: 0, y: 0 }, tension: 0, spawnT: 0, flyT: 0,
    grabStart: 0, peak: 0, cracks: [], trail: [] };
  let freed = 0, score = 0;
  const history = [];
  const flashes = [];
  const shards = [];
  const embers = [];   // fire particles: the clue corner's flames and the burning sphere's trail
  const puffs = [];    // steam when ice melts
  // Ice: a Perfect freezes its corner; a Perfect on the opposite corner thaws it.
  // Hits on ice do damage = impact speed × sphere weight (heavier for stronger grips) and add up.
  const OPPOSITE = { tl: 'br', br: 'tl', tr: 'bl', bl: 'tr' };
  const ICE_STRENGTH = [12, 45];                 // random per freeze
  const weight = R => lerp(0.6, 1.6, R);
  let ice = {};                                  // corner -> { hp, max, cracks }
  const iceCracks = n => Array.from({ length: n }, () => {
    const a = Math.random() * Math.PI / 2, len = 0.35 + Math.random() * 0.65, pts = [[0, 0]];
    let r = 0, ang = a;
    while (r < len) { r += 0.08 + Math.random() * 0.12; ang += (Math.random() - .5) * 0.5; pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); }
    return pts;
  });
  try {
    const saved = JSON.parse(localStorage.getItem('sphere.ice') || '{}');
    for (const k of Object.keys(OPPOSITE)) {
      const v = saved[k];
      if (v && v.hp > 0 && v.max >= v.hp) ice[k] = { hp: v.hp, max: v.max, cracks: iceCracks(Math.round(8 * (1 - v.hp / v.max))) };
    }
  } catch (e) {}
  const saveIce = () => { try { localStorage.setItem('sphere.ice', JSON.stringify(Object.fromEntries(Object.entries(ice).map(([k, v]) => [k, { hp: v.hp, max: v.max }])))); } catch (e) {} };
  // Corner hit = when the sphere touches one wall, how far it is from touching the other,
  // in sphere radii. Distance, not time, so a fast launch doesn't make corners easier.
  const CORNER_TIERS = [
    { max: 0.2, name: 'Perfect', pts: 100 },
    { max: 0.6, name: 'Great', pts: 40 },
    { max: 1.2, name: 'Close', pts: 15 },
  ];
  // Form: perfect throws among the last 20 (1 = the throw hit at least one Perfect corner).
  const FORM_SIZE = 20;
  let form = [];
  try { const f = JSON.parse(localStorage.getItem('sphere.form') || '[]'); if (Array.isArray(f)) form = f.slice(-FORM_SIZE).map(v => v ? 1 : 0); } catch (e) {}
  const pointer = { x: 0, y: 0, down: false, id: null, px: 0, py: 0, vx: 0, vy: 0 };
  const keys = new Set();
  const kbd = { x: 0, y: 0 };

  function spawn() {
    // Random grip: skew a little toward the middle so extremes feel special.
    const R = clamp((Math.random() + Math.random() * 0.6) / 1.6 + (Math.random() - .5) * .35, 0.02, 0.99);
    S.R = R;
    S.breakPull = Math.max(70, minDim * (0.09 + 0.33 * R));
    S.gain = 0.78 - 0.6 * R;           // how much the sphere follows your hand
    S.follow = lerp(0.38, 0.07, R);    // how sluggishly it responds
    S.spring = lerp(0.06, 0.32, R);    // how hard it snaps back when let go
    S.yieldRate = lerp(2.2, 0.5, R);   // strain per second the grip gives up, so ~0.5s to 2s of steady pull
    S.slipMargin = lerp(0.9, 0.45, R); // how far your hand may run ahead of the strain before it slips
    S.strain = 0;
    // a fresh color each spawn; hues near red are skipped so the strain color still reads
    S.hue = 40 + Math.random() * 290;
    S.sat = 0.6 + Math.random() * 0.25;
    S.pos = { x: 0, y: 0 }; S.vel = { x: 0, y: 0 };
    S.tension = 0; S.peak = 0; S.trail = [];
    S.chain = 0; S.lastCorner = -1e9; S.corners = []; S.flame = null;
    S.state = 'spawning'; S.spawnT = 0;
    S.cracks = Array.from({ length: 7 }, (_, i) => {
      const a = (i / 7) * Math.PI * 2 + Math.random() * 0.6;
      const pts = []; let r = 1.15, ang = a;
      const len = 4 + Math.floor(Math.random() * 4);
      for (let j = 0; j < len; j++) { pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); r += 0.18 + Math.random() * 0.22; ang += (Math.random() - .5) * 0.5; }
      return { pts, thr: Math.random() * 0.6 + 0.25 };
    });
  }

  function hitSphere(x, y) {
    const sx = cx + S.pos.x, sy = cy + S.pos.y;
    return Math.hypot(x - sx, y - sy) < radius * 1.7;
  }

  function grab() {
    S.state = 'grabbed'; S.grabStart = performance.now(); S.strain = 0;
    cv.classList.add('grabbing'); $hint.textContent = 'Keep pulling…';
    audio.start();
  }
  function release() {
    if (S.state === 'grabbed') { S.state = 'returning'; $hint.textContent = 'It slipped back. Try again.'; haptics.stop(); haptics.pulse(12); }
    cv.classList.remove('grabbing');
  }

  function breakFree(dirx, diry) {
    const held = (performance.now() - S.grabStart) / 1000;
    S.state = 'flying'; S.flyT = 0; S.heldMs = Math.round(held * 1000);
    const sp = 9 + 16 * S.R;
    S.vel = { x: dirx * sp + pointer.vx * 0.4, y: diry * sp + pointer.vy * 0.4 };
    freed++; $count.textContent = freed;
    const pct = Math.round(S.R * 100);
    history.push(pct); if (history.length > 12) history.shift();
    $history.innerHTML = history.map(r => `<i style="--r:${r}" title="${r}%"></i>`).join('');
    $readout.innerHTML = `Resistance <strong>${pct}%</strong> · ${label(S.R)} · held ${held.toFixed(1)}s`;
    $readout.classList.add('hit'); setTimeout(() => $readout.classList.remove('hit'), 900);
    $hint.textContent = 'Freed. A new one is forming.';
    cv.classList.remove('grabbing');
    audio.snap(S.R);
    haptics.snap(S.R);
  }
  // Pulled faster than the grip can give: the sphere slips out of the hand and springs back.
  function slip() {
    pointer.down = false; pointer.id = null; keys.clear();
    S.state = 'returning'; S.vel = { x: 0, y: 0 };
    cv.classList.remove('grabbing');
    $hint.textContent = 'Too fast. It slipped out of your hand. Pull steadily.';
    audio.creak(1);
    haptics.stop(); haptics.pulse([8, 25, 8]);
  }
  const label = R => R < .2 ? 'loose' : R < .4 ? 'soft' : R < .6 ? 'firm' : R < .8 ? 'stubborn' : 'welded';

  // ---- input ----
  const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => {
    const [x, y] = local(e);
    audio.unlock();
    if (S.state !== 'held' && S.state !== 'returning') return;
    if (!hitSphere(x, y)) return;
    pointer.down = true; pointer.id = e.pointerId;
    pointer.x = pointer.px = x; pointer.y = pointer.py = y;
    // remember where on the sphere it was grabbed so it doesn't jump
    pointer.ox = x - (cx + S.pos.x / Math.max(S.gain, .01) * 0); pointer.oy = 0;
    pointer.anchorX = x - cx - S.pos.x; pointer.anchorY = y - cy - S.pos.y;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    grab();
  });
  cv.addEventListener('pointermove', e => {
    if (!pointer.down || e.pointerId !== pointer.id) return;
    [pointer.x, pointer.y] = local(e);
  });
  const up = e => { if (e.pointerId !== pointer.id) return; pointer.down = false; pointer.id = null; release(); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);

  const dirKeys = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  cv.addEventListener('keydown', e => {
    if (!dirKeys[e.key]) return;
    e.preventDefault(); audio.unlock();
    if (!keys.size && (S.state === 'held' || S.state === 'returning')) { kbd.x = S.pos.x; kbd.y = S.pos.y; grab(); }
    keys.add(e.key);
  });
  cv.addEventListener('keyup', e => {
    if (!dirKeys[e.key]) return;
    keys.delete(e.key);
    if (!keys.size) release();
  });
  cv.addEventListener('blur', () => { if (keys.size) { keys.clear(); release(); } });

  // ---- audio ----
  const audio = (() => {
    let ac = null, osc, osc2, filt, g, on = true, noiseBuf;
    function unlock() {
      if (ac || !on) { if (ac && ac.state === 'suspended') ac.resume(); return; }
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        g = ac.createGain(); g.gain.value = 0;
        filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 400; filt.Q.value = 6;
        osc = ac.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 55;
        osc2 = ac.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = 110;
        osc.connect(filt); osc2.connect(filt); filt.connect(g); g.connect(ac.destination);
        osc.start(); osc2.start();
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    function start() { unlock(); }
    function tension(t, active) {
      if (!ac || !on) return;
      const now = ac.currentTime;
      const target = active ? 0.015 + 0.09 * t * t : 0;
      g.gain.setTargetAtTime(target, now, 0.05);
      osc.frequency.setTargetAtTime(48 + 180 * t * t, now, 0.04);
      osc2.frequency.setTargetAtTime(96 + 420 * t * t + (Math.random() - .5) * 8 * t, now, 0.03);
      filt.frequency.setTargetAtTime(220 + 2400 * t * t, now, 0.05);
    }
    function burst(dur, freq, q, vol) {
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      const gg = ac.createGain(); const now = ac.currentTime;
      gg.gain.setValueAtTime(vol, now); gg.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(f); f.connect(gg); gg.connect(ac.destination); src.start(now); src.stop(now + dur + 0.02);
    }
    function creak(t) { if (ac && on) burst(0.03 + Math.random() * 0.04, 600 + Math.random() * 1800 * t, 12, 0.05 + 0.15 * t); }
    function snap(R) {
      if (!ac || !on) return;
      g.gain.setTargetAtTime(0, ac.currentTime, 0.02);
      burst(0.25, 2200, 1.2, 0.5);
      const o = ac.createOscillator(), gg = ac.createGain(), now = ac.currentTime;
      o.type = 'sine'; o.frequency.setValueAtTime(300 + 500 * R, now); o.frequency.exponentialRampToValueAtTime(60, now + 0.35);
      gg.gain.setValueAtTime(0.35, now); gg.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
      o.connect(gg); gg.connect(ac.destination); o.start(now); o.stop(now + 0.45);
    }
    function thud(v) { if (ac && on) burst(0.08, 180 + v * 20, 2, Math.min(0.3, v * 0.03)); }
    function pop() {
      if (!ac || !on) return;
      const o = ac.createOscillator(), gg = ac.createGain(), now = ac.currentTime;
      o.type = 'sine'; o.frequency.setValueAtTime(180, now); o.frequency.exponentialRampToValueAtTime(520, now + 0.12);
      gg.gain.setValueAtTime(0.12, now); gg.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
      o.connect(gg); gg.connect(ac.destination); o.start(now); o.stop(now + 0.2);
    }
    function chime(tierName) {
      if (!ac || !on) return;
      const notes = tierName === 'Perfect' ? [660, 880, 1320] : tierName === 'Great' ? [660, 990] : [620];
      notes.forEach((f, i) => {
        const o = ac.createOscillator(), gg = ac.createGain(), t0 = ac.currentTime + i * 0.08;
        o.type = 'triangle'; o.frequency.value = f;
        gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
        gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
        o.connect(gg); gg.connect(ac.destination); o.start(t0); o.stop(t0 + 0.4);
      });
    }
    function toggle() {
      on = !on;
      if (!on && g) g.gain.setTargetAtTime(0, ac.currentTime, 0.02);
      if (on) unlock();
      return on;
    }
    function tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
      const o = ac.createOscillator(), gg = ac.createGain(), t0 = ac.currentTime + delay;
      o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
      gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    ctx.globalAlpha = alpha * 0.35;
    ctx.fillStyle = rgba(C.fg, 0.35);
    ctx.beginPath(); ctx.ellipse(sx + radius * 0.15, sy + radius * 0.9 * scale, radius * 0.85 * scale, radius * 0.22 * scale, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // fire halo around a burning sphere
    if (S.flame) {
      const fr = radius * (1.8 + (reduceMotion ? 0 : 0.2 * Math.sin(now / 60)));
      const halo = ctx.createRadialGradient(sx, sy, radius * 0.7, sx, sy, fr);
      halo.addColorStop(0, rgba(C['flame-hot'], 0.7 * alpha)); halo.addColorStop(0.5, rgba(C.flame, 0.4 * alpha)); halo.addColorStop(1, rgba(C.flame, 0));
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(sx, sy, fr, 0, Math.PI * 2); ctx.fill();
    }

    // strain halo
    if (t > 0.02) {
      const halo = ctx.createRadialGradient(sx, sy, radius * 0.9, sx, sy, radius * (1.4 + t));
      halo.addColorStop(0, rgba(C.strain, 0.45 * t * alpha)); halo.addColorStop(1, rgba(C.strain, 0));
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(sx, sy, radius * (1.4 + t), 0, Math.PI * 2); ctx.fill();
    }

    // sphere with squash & stretch along the pull
    let stretch = 1, squash = 1;
    if (S.state === 'grabbed' || S.state === 'returning') { stretch = 1 + 0.28 * t * (1 - S.R * 0.4); squash = 1 - 0.14 * t; }
    if (S.state === 'flying') { const sp = Math.hypot(S.vel.x, S.vel.y); stretch = 1 + Math.min(0.25, sp * 0.012); squash = 1 / stretch; }
    const dirA = S.state === 'flying' ? Math.atan2(S.vel.y, S.vel.x) : ang;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(sx, sy); ctx.rotate(dirA); ctx.scale(stretch * scale, squash * scale); ctx.rotate(-dirA);
    const body = S.flame ? mix(SC.body, C.flame, 0.7) : mix(SC.body, C.strain, t * 0.75);
    const g = ctx.createRadialGradient(-radius * 0.35, -radius * 0.4, radius * 0.08, 0, 0, radius);
    g.addColorStop(0, rgba(mix(SC.hi, [255, 255, 255], 0.4)));
    g.addColorStop(0.25, rgba(mix(body, SC.hi, 0.35)));
    g.addColorStop(0.75, rgba(body));
    g.addColorStop(1, rgba(mix(body, [0, 0, 0], 0.45)));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
    // rim light
    ctx.strokeStyle = rgba(SC.hi, 0.35); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, radius - 1, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    // specular
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(-radius * 0.38, -radius * 0.42, radius * 0.18, radius * 0.11, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // tension meter arc around socket (only while pulling)
    if (S.state === 'grabbed') {
      ctx.strokeStyle = rgba(mix(C.muted, C.strain, t), 0.9);
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy, sockR + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * t); ctx.stroke();
    }

    // idle breathing hint
    if (S.state === 'held' && !reduceMotion) {
      const p = (now % 2400) / 2400;
      ctx.strokeStyle = rgba(SC.body, 0.35 * (1 - p));
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, radius * (1.05 + p * 0.6), 0, Math.PI * 2); ctx.stroke();
    }

    // corner hit flashes: rings spreading from the corner, plus the points
    for (let i = flashes.length - 1; i >= 0; i--) {
      // rAF's timestamp can be slightly older than the performance.now() the hit was stamped with
      const f = flashes[i], age = Math.max(0, (now - f.t0) / 1300);
      if (age >= 1) { flashes.splice(i, 1); continue; }
      const col = f.col === 'strain' ? C.strain : f.col === 'ice' ? C['ice-edge'] : SC.body;
      const fade = 1 - age;
      ctx.lineWidth = 3;
      for (let r = 0; r < f.rings; r++) {
        const rr = Math.max(1, (reduceMotion ? 0.6 : age) * minDim * 0.35 + r * 22);
        ctx.strokeStyle = rgba(col, 0.6 * fade);
        ctx.beginPath(); ctx.arc(f.x, f.y, rr, 0, Math.PI * 2); ctx.stroke();
      }
      const ix = f.x === 0 ? 1 : -1, iy = f.y === 0 ? 1 : -1;
      const tx = f.x + ix * minDim * 0.3, ty = f.y + iy * minDim * 0.3 - (reduceMotion ? 0 : age * 24);
      ctx.save();
      ctx.globalAlpha = Math.min(1, fade * 1.6);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(col);
      ctx.font = `700 ${Math.round(Math.max(18, minDim * 0.05))}px Unbounded, system-ui, sans-serif`;
      ctx.fillText(f.label, tx, ty);
      if (f.sub) {
        ctx.fillStyle = rgba(C.fg);
        ctx.font = `500 ${Math.round(Math.max(14, minDim * 0.032))}px "IBM Plex Mono", ui-monospace, monospace`;
        ctx.fillText(f.sub, tx, ty + Math.max(22, minDim * 0.05));
      }
      ctx.restore();
    }

    // ice shards flying off a cracked or shattered corner
    for (let i = shards.length - 1; i >= 0; i--) {
      const s = shards[i], age = Math.max(0, (now - s.t0) / 900);
      if (age >= 1) { shards.splice(i, 1); continue; }
      s.x += s.vx; s.y += s.vy; s.vx *= 0.96; s.vy *= 0.96; s.rot += s.vr;
      ctx.save();
      ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.fillStyle = rgba(C.ice, 0.85 * (1 - age));
      ctx.strokeStyle = rgba(C['ice-edge'], 0.9 * (1 - age)); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, -s.size); ctx.lineTo(s.size * 0.6, s.size * 0.5); ctx.lineTo(-s.size * 0.5, s.size * 0.4); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  // The clue: flames on the corner opposite each frozen one. Plus embers and steam in flight.
  function drawFire(now) {
    for (const k of Object.keys(ice)) {
      const f = OPPOSITE[k];
      const x = f[1] === 'l' ? 0 : W, y = f[0] === 't' ? 0 : H;
      const ix = x === 0 ? 1 : -1, iy = y === 0 ? 1 : -1;
      // warm glow
      const glow = ctx.createRadialGradient(x, y, 0, x, y, radius * 3);
      glow.addColorStop(0, rgba(C['flame-hot'], 0.35)); glow.addColorStop(0.5, rgba(C.flame, 0.15)); glow.addColorStop(1, rgba(C.flame, 0));
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, radius * 3, 0, Math.PI * 2); ctx.fill();
      // flickering tongues along the corner, pointing toward the middle of the screen
      const n = 7, base = radius * 0.9;
      for (let i = 0; i < n; i++) {
        const a = (i + 0.5) / n * Math.PI / 2;
        const bx = x + ix * Math.cos(a) * base, by = y + iy * Math.sin(a) * base;
        const flick = reduceMotion ? 1 : 0.75 + 0.35 * Math.sin(now / 90 + i * 1.7) * Math.sin(now / 155 + i);
        const h = radius * (1.1 + 0.5 * Math.sin(i * 2.3) ** 2) * flick, wdt = radius * 0.32;
        const dx = ix * Math.cos(a), dy = iy * Math.sin(a);           // outward from the corner
        const px = -dy, py = dx;                                        // across the tongue
        const sway = reduceMotion ? 0 : Math.sin(now / 120 + i) * wdt * 0.5;
        const tipX = bx + dx * h + px * sway, tipY = by + dy * h + py * sway;
        const g = ctx.createLinearGradient(bx, by, tipX, tipY);
        g.addColorStop(0, rgba(C['flame-hot'], 0.95)); g.addColorStop(0.55, rgba(C.flame, 0.8)); g.addColorStop(1, rgba(C.flame, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(bx + px * wdt, by + py * wdt);
        ctx.quadraticCurveTo(bx + dx * h * 0.5 + px * wdt, by + dy * h * 0.5 + py * wdt, tipX, tipY);
        ctx.quadraticCurveTo(bx + dx * h * 0.5 - px * wdt, by + dy * h * 0.5 - py * wdt, bx - px * wdt, by - py * wdt);
        ctx.closePath(); ctx.fill();
      }
      if (!reduceMotion && Math.random() < 0.5) {
        const a = Math.random() * Math.PI / 2;
        embers.push({ x: x + ix * Math.cos(a) * base * 1.4, y: y + iy * Math.sin(a) * base * 1.4,
          vx: ix * Math.cos(a) * (0.5 + Math.random()), vy: iy * Math.sin(a) * (0.5 + Math.random()) - 0.4, r: radius * 0.12, life: 700, t0: now });
      }
    }
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i], age = Math.max(0, (now - e.t0) / e.life);
      if (age >= 1) { embers.splice(i, 1); continue; }
      e.x += e.vx; e.y += e.vy;
      ctx.fillStyle = rgba(mix(C['flame-hot'], C.flame, age), 0.8 * (1 - age));
      ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(0.5, e.r * (1 - age * 0.6)), 0, Math.PI * 2); ctx.fill();
    }
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i], age = Math.max(0, (now - p.t0) / 1400);
      if (age >= 1) { puffs.splice(i, 1); continue; }
      p.x += p.vx; p.y += p.vy; p.vx *= 0.98; p.vy *= 0.98;
      ctx.fillStyle = rgba(mix(C.ice, [255, 255, 255], 0.6), 0.45 * (1 - age));
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + age * 1.8), 0, Math.PI * 2); ctx.fill();
    }
  }

  // Frozen corners: a quarter disc of ice, thicker for stronger ice, fading and cracking as it's damaged.
  function drawIce(now) {
    const iceR = radius * 2.8;
    for (const [k, c] of Object.entries(ice)) {
      const x = k[1] === 'l' ? 0 : W, y = k[0] === 't' ? 0 : H;
      const ix = x === 0 ? 1 : -1, iy = y === 0 ? 1 : -1;
      const health = clamp(c.hp / c.max, 0, 1);
      const thick = (c.max - ICE_STRENGTH[0]) / (ICE_STRENGTH[1] - ICE_STRENGTH[0]);
      const r = iceR * (0.85 + 0.3 * thick);
      const start = Math.atan2(0, ix), end = Math.atan2(iy, 0);
      const a0 = Math.min(start, end), a1 = Math.max(start, end);
      const [s0, s1] = Math.abs(a1 - a0) > Math.PI ? [a1, a0 + Math.PI * 2] : [a0, a1];
      ctx.save();
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(C['ice-edge'], (0.35 + 0.35 * thick) * (0.4 + 0.6 * health)));
      g.addColorStop(0.7, rgba(C.ice, (0.45 + 0.3 * thick) * (0.4 + 0.6 * health)));
      g.addColorStop(1, rgba(C.ice, 0.15 * health));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, s0, s1); ctx.closePath(); ctx.fill();
      // frosty rim with a slow glint
      ctx.strokeStyle = rgba(C['ice-edge'], 0.7 * (0.5 + 0.5 * health)); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r, s0, s1); ctx.stroke();
      if (!reduceMotion) {
        const gl = s0 + ((now / 2600) % 1) * (s1 - s0);
        ctx.strokeStyle = rgba([255, 255, 255], 0.5 * health); ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, y, r - 1, gl - 0.08, gl + 0.08); ctx.stroke();
      }
      // cracks, in the corner's own orientation
      ctx.strokeStyle = rgba(mix(C['ice-edge'], C.fg, 0.4), 0.75); ctx.lineWidth = 1.3; ctx.lineCap = 'round';
      for (const pts of c.cracks) {
        ctx.beginPath();
        pts.forEach(([px, py], i) => { const X = x + ix * px * r, Y = y + iy * py * r; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function loop(now) {
    const dt = Math.min(50, now - last); last = now;
    step(dt); draw(now);
    requestAnimationFrame(loop);
  }

  function start(data) {
    if (data && data.freed) { freed = data.freed; $count.textContent = freed; }
    if (data && data.score) { score = data.score; $score.textContent = score; }
    if (data && Array.isArray(data.history)) {
      history.push(...data.history.slice(-12));
      $history.innerHTML = history.map(r => `<i style="--r:${r}" title="${r}%"></i>`).join('');
    }
    renderForm();
    spawn();
    requestAnimationFrame(t => { last = t; loop(t); });
  }
  window.claude?.hot?.snapshot?.(() => ({ freed, score, history: history.slice() }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
