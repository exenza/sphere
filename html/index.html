<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sphere</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed canvas; quiet HUD pinned to the corners, the sphere owns the middle. */
  :root {
    --bg: #E9E7F0;
    --bg-deep: #DAD6E6;
    --fg: #1F1B2E;
    --muted: #6B6580;
    --sphere: #3B5BDB;
    --sphere-hi: #C9D4FF;
    --strain: #E5483A;
    --socket: #BDB7CF;
    --font-display: "Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15131D; --bg-deep: #0E0C14; --fg: #ECE9F5; --muted: #8E88A6;
      --sphere: #6E8BFF; --sphere-hi: #E3E9FF; --strain: #FF6F5C; --socket: #34304A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15131D; --bg-deep: #0E0C14; --fg: #ECE9F5; --muted: #8E88A6;
    --sphere: #6E8BFF; --sphere-hi: #E3E9FF; --strain: #FF6F5C; --socket: #34304A;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; outline: none; }
  #stage.grabbing { cursor: grabbing; }
  #stage:focus-visible { box-shadow: inset 0 0 0 3px var(--sphere); }

  .hud {
    position: fixed; left: 0; right: 0; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .hud.top { top: 0; padding-block: calc(16px + env(safe-area-inset-top, 0px)) 0; }
  .hud.bottom {
    bottom: 0; padding-block: 0 calc(18px + env(safe-area-inset-bottom, 0px));
    flex-direction: column; align-items: center; gap: 10px; text-align: center;
  }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(18px, 3.2vw, 26px); letter-spacing: -0.01em; line-height: 1;
  }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; max-width: 30ch; text-wrap: balance; }
  .stats { display: flex; align-items: center; gap: 14px; }
  .stat { text-align: right; }
  .stat b { display: block; font-family: var(--font-data); font-weight: 500; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .toggles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  button.toggle {
    pointer-events: auto; font: 500 12px var(--font-data); color: var(--fg);
    background: transparent; border: 1px solid var(--socket); border-radius: 999px;
    padding: 7px 12px; cursor: pointer; letter-spacing: 0.04em;
  }
  button.toggle[aria-pressed="false"] { color: var(--muted); }
  button.toggle:hover { border-color: var(--muted); }
  button.toggle:disabled { cursor: not-allowed; opacity: .55; }
  button.toggle:focus-visible { outline: 2px solid var(--sphere); outline-offset: 2px; }

  #readout {
    font-family: var(--font-data); font-size: 13px; color: var(--muted); min-height: 1.4em;
    font-variant-numeric: tabular-nums; transition: color .3s;
  }
  #readout.hit { color: var(--fg); }
  #readout strong { font-weight: 500; color: var(--strain); }
  .history { display: flex; gap: 6px; align-items: flex-end; height: 34px; }
  .history i {
    display: block; width: 10px; border-radius: 3px 3px 1px 1px;
    background: color-mix(in srgb, var(--sphere) calc(100% - var(--r) * 1%), var(--strain));
    height: calc(4px + var(--r) * 0.3px); opacity: .85;
  }
  .history i:last-child { opacity: 1; outline: 1px solid var(--fg); outline-offset: 2px; }
  .hint { font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) { .sub { display: none; } .stat b { font-size: 18px; } }
</style>

<canvas id="stage" tabindex="0" aria-label="Sphere in its socket. Drag it away from the center, or hold the arrow keys, until it breaks free."></canvas>

<div class="hud top">
  <div>
    <h1>Sphere</h1>
    <p class="sub">Pull the sphere out of its socket. Every new sphere grips with a different strength.</p>
  </div>
  <div class="stats">
    <div class="stat"><b id="count">0</b><span>freed</span></div>
    <div class="toggles">
      <button id="sound" class="toggle" type="button" aria-pressed="true">SOUND ON</button>
      <button id="vibe" class="toggle" type="button" aria-pressed="true">VIBRATION ON</button>
    </div>
  </div>
</div>

<div class="hud bottom">
  <div class="history" id="history" aria-label="Resistance of recent spheres"></div>
  <div id="readout" aria-live="polite"></div>
  <div class="hint" id="hint">Grab the sphere and pull.</div>
</div>

<script>
(() => {
  const cv = document.getElementById('stage');
  const ctx = cv.getContext('2d');
  const $count = document.getElementById('count');
  const $readout = document.getElementById('readout');
  const $history = document.getElementById('history');
  const $hint = document.getElementById('hint');
  const $sound = document.getElementById('sound');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, radius = 40, minDim = 400;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2; cy = H / 2 + 10;
    minDim = Math.min(W, H);
    radius = Math.max(26, Math.min(52, minDim * 0.075));
  }
  addEventListener('resize', resize); resize();

  // ---- colors from tokens ----
  const css = getComputedStyle(document.documentElement);
  const hex = s => { s = s.trim().replace('#', ''); if (s.length === 3) s = [...s].map(c => c + c).join(''); const n = parseInt(s, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  let C = {};
  function readColors() { for (const k of ['bg', 'bg-deep', 'fg', 'muted', 'sphere', 'sphere-hi', 'strain', 'socket']) C[k] = hex(css.getPropertyValue('--' + k) || '#888'); }
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(readColors, 0));
  new MutationObserver(() => setTimeout(readColors, 0)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---- game state ----
  const S = { state: 'spawning', R: 0, breakPull: 0, gain: 1, follow: .3, spring: .1,
    pos: { x: 0, y: 0 }, vel: { x: 0, y: 0 }, tension: 0, spawnT: 0, flyT: 0,
    grabStart: 0, peak: 0, cracks: [], trail: [] };
  let freed = 0;
  const history = [];
  const pointer = { x: 0, y: 0, down: false, id: null, px: 0, py: 0, vx: 0, vy: 0 };
  const keys = new Set();
  const kbd = { x: 0, y: 0 };

  function spawn() {
    // Random grip: skew a little toward the middle so extremes feel special.
    const R = clamp((Math.random() + Math.random() * 0.6) / 1.6 + (Math.random() - .5) * .35, 0.02, 0.99);
    S.R = R;
    S.breakPull = Math.max(70, minDim * (0.09 + 0.33 * R));
    S.gain = 0.78 - 0.6 * R;           // how much the sphere follows your hand
    S.follow = lerp(0.38, 0.07, R);    // how sluggishly it responds
    S.spring = lerp(0.06, 0.32, R);    // how hard it snaps back when let go
    S.pos = { x: 0, y: 0 }; S.vel = { x: 0, y: 0 };
    S.tension = 0; S.peak = 0; S.trail = [];
    S.state = 'spawning'; S.spawnT = 0;
    S.cracks = Array.from({ length: 7 }, (_, i) => {
      const a = (i / 7) * Math.PI * 2 + Math.random() * 0.6;
      const pts = []; let r = 1.15, ang = a;
      const len = 4 + Math.floor(Math.random() * 4);
      for (let j = 0; j < len; j++) { pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); r += 0.18 + Math.random() * 0.22; ang += (Math.random() - .5) * 0.5; }
      return { pts, thr: Math.random() * 0.6 + 0.25 };
    });
  }

  function hitSphere(x, y) {
    const sx = cx + S.pos.x, sy = cy + S.pos.y;
    return Math.hypot(x - sx, y - sy) < radius * 1.7;
  }

  function grab() {
    S.state = 'grabbed'; S.grabStart = performance.now();
    cv.classList.add('grabbing'); $hint.textContent = 'Keep pulling…';
    audio.start();
  }
  function release() {
    if (S.state === 'grabbed') { S.state = 'returning'; $hint.textContent = 'It slipped back. Try again.'; haptics.stop(); haptics.pulse(12); }
    cv.classList.remove('grabbing');
  }

  function breakFree(dirx, diry) {
    const held = (performance.now() - S.grabStart) / 1000;
    S.state = 'flying'; S.flyT = 0;
    const sp = 9 + 16 * S.R;
    S.vel = { x: dirx * sp + pointer.vx * 0.4, y: diry * sp + pointer.vy * 0.4 };
    freed++; $count.textContent = freed;
    const pct = Math.round(S.R * 100);
    history.push(pct); if (history.length > 12) history.shift();
    $history.innerHTML = history.map(r => `<i style="--r:${r}" title="${r}%"></i>`).join('');
    $readout.innerHTML = `Resistance <strong>${pct}%</strong> · ${label(S.R)} · held ${held.toFixed(1)}s`;
    $readout.classList.add('hit'); setTimeout(() => $readout.classList.remove('hit'), 900);
    $hint.textContent = 'Freed. A new one is forming.';
    cv.classList.remove('grabbing');
    audio.snap(S.R);
    haptics.snap(S.R);
  }
  const label = R => R < .2 ? 'loose' : R < .4 ? 'soft' : R < .6 ? 'firm' : R < .8 ? 'stubborn' : 'welded';

  // ---- input ----
  const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => {
    const [x, y] = local(e);
    audio.unlock();
    if (S.state !== 'held' && S.state !== 'returning') return;
    if (!hitSphere(x, y)) return;
    pointer.down = true; pointer.id = e.pointerId;
    pointer.x = pointer.px = x; pointer.y = pointer.py = y;
    // remember where on the sphere it was grabbed so it doesn't jump
    pointer.ox = x - (cx + S.pos.x / Math.max(S.gain, .01) * 0); pointer.oy = 0;
    pointer.anchorX = x - cx - S.pos.x; pointer.anchorY = y - cy - S.pos.y;
    cv.setPointerCapture(e.pointerId);
    grab();
  });
  cv.addEventListener('pointermove', e => {
    if (!pointer.down || e.pointerId !== pointer.id) return;
    [pointer.x, pointer.y] = local(e);
  });
  const up = e => { if (e.pointerId !== pointer.id) return; pointer.down = false; pointer.id = null; release(); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);

  const dirKeys = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  cv.addEventListener('keydown', e => {
    if (!dirKeys[e.key]) return;
    e.preventDefault(); audio.unlock();
    if (!keys.size && (S.state === 'held' || S.state === 'returning')) { kbd.x = S.pos.x; kbd.y = S.pos.y; grab(); }
    keys.add(e.key);
  });
  cv.addEventListener('keyup', e => {
    if (!dirKeys[e.key]) return;
    keys.delete(e.key);
    if (!keys.size) release();
  });
  cv.addEventListener('blur', () => { if (keys.size) { keys.clear(); release(); } });

  // ---- audio ----
  const audio = (() => {
    let ac = null, osc, osc2, filt, g, on = true, noiseBuf;
    function unlock() {
      if (ac || !on) { if (ac && ac.state === 'suspended') ac.resume(); return; }
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        g = ac.createGain(); g.gain.value = 0;
        filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 400; filt.Q.value = 6;
        osc = ac.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 55;
        osc2 = ac.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = 110;
        osc.connect(filt); osc2.connect(filt); filt.connect(g); g.connect(ac.destination);
        osc.start(); osc2.start();
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    function start() { unlock(); }
    function tension(t, active) {
      if (!ac || !on) return;
      const now = ac.currentTime;
      const target = active ? 0.015 + 0.09 * t * t : 0;
      g.gain.setTargetAtTime(target, now, 0.05);
      osc.frequency.setTargetAtTime(48 + 180 * t * t, now, 0.04);
      osc2.frequency.setTargetAtTime(96 + 420 * t * t + (Math.random() - .5) * 8 * t, now, 0.03);
      filt.frequency.setTargetAtTime(220 + 2400 * t * t, now, 0.05);
    }
    function burst(dur, freq, q, vol) {
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      const gg = ac.createGain(); const now = ac.currentTime;
      gg.gain.setValueAtTime(vol, now); gg.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(f); f.connect(gg); gg.connect(ac.destination); src.start(now); src.stop(now + dur + 0.02);
    }
    function creak(t) { if (ac && on) burst(0.03 + Math.random() * 0.04, 600 + Math.random() * 1800 * t, 12, 0.05 + 0.15 * t); }
    function snap(R) {
      if (!ac || !on) return;
      g.gain.setTargetAtTime(0, ac.currentTime, 0.02);
      burst(0.25, 2200, 1.2, 0.5);
      const o = ac.createOscillator(), gg = ac.createGain(), now = ac.currentTime;
      o.type = 'sine'; o.frequency.setValueAtTime(300 + 500 * R, now); o.frequency.exponentialRampToValueAtTime(60, now + 0.35);
      gg.gain.setValueAtTime(0.35, now); gg.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
      o.connect(gg); gg.connect(ac.destination); o.start(now); o.stop(now + 0.45);
    }
    function thud(v) { if (ac && on) burst(0.08, 180 + v * 20, 2, Math.min(0.3, v * 0.03)); }
    function pop() {
      if (!ac || !on) return;
      const o = ac.createOscillator(), gg = ac.createGain(), now = ac.currentTime;
      o.type = 'sine'; o.frequency.setValueAtTime(180, now); o.frequency.exponentialRampToValueAtTime(520, now + 0.12);
      gg.gain.setValueAtTime(0.12, now); gg.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
      o.connect(gg); gg.connect(ac.destination); o.start(now); o.stop(now + 0.2);
    }
    function toggle() {
      on = !on;
      if (!on && g) g.gain.setTargetAtTime(0, ac.currentTime, 0.02);
      if (on) unlock();
      return on;
    }
    return { unlock, start, tension, creak, snap, thud, pop, toggle };
  })();
  $sound.addEventListener('click', () => {
    const on = audio.toggle();
    $sound.textContent = on ? 'SOUND ON' : 'SOUND OFF';
    $sound.setAttribute('aria-pressed', on);
  });

  // ---- vibration ----
  // Tension is felt as a pulse train: pulses get longer and closer together as the grip strains.
  const $vibe = document.getElementById('vibe');
  const haptics = (() => {
    const supported = typeof navigator.vibrate === 'function';
    let on = supported, blocked = false, nextAt = 0;
    function buzz(pattern) {
      if (!on || blocked || navigator.userActivation?.hasBeenActive === false) return;
      try {
        // vibrate() returns false when the browser refuses (no gesture yet, or the frame forbids it)
        if (navigator.vibrate(pattern) === false && navigator.userActivation?.hasBeenActive) markBlocked();
      } catch (e) { markBlocked(); }
    }
    function markBlocked() {
      blocked = true;
      $vibe.textContent = 'VIBRATION BLOCKED'; $vibe.disabled = true; $vibe.setAttribute('aria-pressed', 'false');
      $vibe.title = 'This browser or view does not allow vibration. Try Chrome on an Android phone.';
    }
    if (!supported) {
      $vibe.textContent = 'NO VIBRATION'; $vibe.disabled = true; $vibe.setAttribute('aria-pressed', 'false');
      $vibe.title = 'This device or browser has no vibration support (iPhones and desktops do not).';
    }
    return {
      tension(t, now) {
        if (t < 0.04 || now < nextAt) return;
        const dur = Math.round(lerp(6, 34, t * t) * (0.7 + 0.6 * S.R));
        nextAt = now + lerp(320, 45, t);
        buzz(dur);
      },
      pulse(ms) { buzz(ms); },
      stop() { nextAt = 0; if (on && !blocked) try { navigator.vibrate(0); } catch (e) {} },
      snap(R) { buzz([Math.round(25 + 35 * R), 40, Math.round(60 + 80 * R)]); },
      thud(v) { if (v > 1.5) buzz(Math.round(Math.min(45, v * 3))); },
      toggle() {
        if (!supported || blocked) return false;
        on = !on;
        if (!on) try { navigator.vibrate(0); } catch (e) {}
        else buzz(20);
        return on;
      },
    };
  })();
  $vibe.addEventListener('click', () => {
    const on = haptics.toggle();
    if ($vibe.disabled) return;
    $vibe.textContent = on ? 'VIBRATION ON' : 'VIBRATION OFF';
    $vibe.setAttribute('aria-pressed', on);
  });
  const bump = v => { audio.thud(v); haptics.thud(v); };

  // ---- simulation ----
  let last = performance.now();
  function step(dt) {
    if (S.state === 'spawning') {
      S.spawnT += dt / (reduceMotion ? 200 : 650);
      if (S.spawnT >= 1) { S.spawnT = 1; S.state = 'held'; $hint.textContent = 'Grab the sphere and pull.'; audio.pop(); haptics.pulse(10); }
    }

    if (S.state === 'grabbed') {
      let pullX, pullY;
      if (pointer.down) {
        pullX = pointer.x - pointer.anchorX - cx;
        pullY = pointer.y - pointer.anchorY - cy;
        pointer.vx = lerp(pointer.vx, pointer.x - pointer.px, 0.4);
        pointer.vy = lerp(pointer.vy, pointer.y - pointer.py, 0.4);
        pointer.px = pointer.x; pointer.py = pointer.y;
      } else {
        let dx = 0, dy = 0; keys.forEach(k => { dx += dirKeys[k][0]; dy += dirKeys[k][1]; });
        const speed = 3.2 * (dt / 16.7);
        kbd.x += dx * speed; kbd.y += dy * speed;
        pullX = kbd.x / Math.max(S.gain, .05); pullY = kbd.y / Math.max(S.gain, .05);
        // keyboard drives the hand directly: convert back below
        pullX = kbd.x; pullY = kbd.y;
        pointer.vx = dx * 4; pointer.vy = dy * 4;
      }
      const pull = Math.hypot(pullX, pullY);
      const t = pull / S.breakPull;
      S.tension = clamp(t, 0, 1);
      S.peak = Math.max(S.peak, S.tension);
      // rubbery response: follows less as it nears the limit
      const ease = S.gain * (1 - 0.35 * S.tension * S.tension);
      const tx = pullX * ease, ty = pullY * ease;
      const k = 1 - Math.pow(1 - S.follow, dt / 16.7);
      S.pos.x = lerp(S.pos.x, tx, k); S.pos.y = lerp(S.pos.y, ty, k);
      audio.tension(S.tension, true);
      haptics.tension(S.tension, performance.now());
      if (Math.random() < S.tension * S.tension * 0.18 * (0.5 + S.R)) audio.creak(S.tension);
      if (t >= 1) {
        const d = Math.hypot(S.pos.x, S.pos.y) || 1;
        breakFree(S.pos.x / d, S.pos.y / d);
        pointer.down = false; keys.clear();
      }
    } else {
      audio.tension(0, false);
    }

    if (S.state === 'returning') {
      const f = dt / 16.7;
      S.vel.x += -S.pos.x * S.spring * f; S.vel.y += -S.pos.y * S.spring * f;
      const damp = Math.pow(0.8, f);
      S.vel.x *= damp; S.vel.y *= damp;
      S.pos.x += S.vel.x * f; S.pos.y += S.vel.y * f;
      S.tension = clamp(Math.hypot(S.pos.x, S.pos.y) / (S.breakPull * S.gain), 0, 1) * 0.8;
      if (Math.hypot(S.pos.x, S.pos.y) < 0.3 && Math.hypot(S.vel.x, S.vel.y) < 0.3) {
        S.pos.x = S.pos.y = 0; S.vel.x = S.vel.y = 0; S.tension = 0; S.state = 'held';
      }
    }

    if (S.state === 'flying') {
      const f = dt / 16.7;
      S.flyT += dt;
      S.vel.x *= Math.pow(0.985, f); S.vel.y *= Math.pow(0.985, f);
      S.pos.x += S.vel.x * f; S.pos.y += S.vel.y * f;
      S.tension = Math.max(0, S.tension - 0.05 * f);
      const ax = cx + S.pos.x, ay = cy + S.pos.y;
      if (ax < radius) { S.pos.x = radius - cx; S.vel.x = Math.abs(S.vel.x) * 0.7; bump(Math.abs(S.vel.x)); }
      if (ax > W - radius) { S.pos.x = W - radius - cx; S.vel.x = -Math.abs(S.vel.x) * 0.7; bump(Math.abs(S.vel.x)); }
      if (ay < radius) { S.pos.y = radius - cy; S.vel.y = Math.abs(S.vel.y) * 0.7; bump(Math.abs(S.vel.y)); }
      if (ay > H - radius) { S.pos.y = H - radius - cy; S.vel.y = -Math.abs(S.vel.y) * 0.7; bump(Math.abs(S.vel.y)); }
      S.trail.push([ax, ay]); if (S.trail.length > 18) S.trail.shift();
      if (S.flyT > 1800) spawn();
    }
  }

  // ---- drawing ----
  function draw(now) {
    const t = S.tension;
    ctx.clearRect(0, 0, W, H);

    // ground vignette
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    bg.addColorStop(0, rgba(C.bg)); bg.addColorStop(1, rgba(C['bg-deep']));
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // strain field: faint concentric rings that tighten with tension
    const live = S.state === 'grabbed' || S.state === 'returning' || S.state === 'held';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 5; i++) {
      const rr = radius * (1.4 + i * 0.9) * (1 - 0.12 * t);
      ctx.strokeStyle = rgba(mix(C.socket, C.strain, t), (0.35 - i * 0.05) * (live ? 1 : 0.5));
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
    }

    // socket
    const sockR = radius * 1.18;
    ctx.fillStyle = rgba(C['bg-deep'], 1);
    ctx.beginPath(); ctx.arc(cx, cy, sockR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = rgba(C.socket, 1); ctx.lineWidth = 2; ctx.stroke();
    const inner = ctx.createRadialGradient(cx, cy - sockR * .3, sockR * .2, cx, cy, sockR);
    inner.addColorStop(0, rgba(C.fg, 0.0)); inner.addColorStop(1, rgba(C.fg, 0.12));
    ctx.fillStyle = inner; ctx.beginPath(); ctx.arc(cx, cy, sockR, 0, Math.PI * 2); ctx.fill();

    // cracks grow with peak tension of this sphere
    const crackAmt = S.state === 'flying' ? 1 : S.peak;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const c of S.cracks) {
      const vis = clamp((crackAmt - c.thr) / (1 - c.thr + 0.0001), 0, 1);
      if (vis <= 0) continue;
      const n = Math.max(2, Math.ceil(c.pts.length * vis));
      ctx.strokeStyle = rgba(mix(C.socket, C.fg, 0.55), 0.7 * vis);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let i = 0; i < n; i++) { const p = c.pts[i]; const x = cx + p[0] * radius, y = cy + p[1] * radius; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    }

    // sphere geometry
    let sx = cx + S.pos.x, sy = cy + S.pos.y;
    if (S.state === 'grabbed' && !reduceMotion) {
      const amp = Math.pow(t, 3) * (2 + 4 * S.R);
      sx += (Math.random() - .5) * amp; sy += (Math.random() - .5) * amp;
    }
    const dist = Math.hypot(S.pos.x, S.pos.y);
    const ang = Math.atan2(S.pos.y, S.pos.x);
    let scale = 1, alpha = 1;
    if (S.state === 'spawning') { const p = S.spawnT; scale = 1 - Math.pow(1 - p, 3) * 1 + Math.sin(p * Math.PI) * 0.12; alpha = Math.min(1, p * 2); }
    if (S.state === 'flying' && S.flyT > 1300) alpha = 1 - (S.flyT - 1300) / 500;
    alpha = clamp(alpha, 0, 1);

    // tethers
    if (S.state !== 'flying' && S.state !== 'spawning' && dist > 0.5) {
      const strands = 6;
      for (let i = 0; i < strands; i++) {
        const a = ang + Math.PI + (i - (strands - 1) / 2) * 0.32;
        const ox = cx + Math.cos(a) * sockR * 0.6, oy = cy + Math.sin(a) * sockR * 0.6;
        const ea = ang + Math.PI + (i - (strands - 1) / 2) * 0.42;
        const ex = sx + Math.cos(ea) * radius * 0.85, ey = sy + Math.sin(ea) * radius * 0.85;
        const mx = (ox + ex) / 2 + Math.cos(ang + Math.PI / 2) * (i - 2.5) * 3 * (1 - t);
        const my = (oy + ey) / 2 + Math.sin(ang + Math.PI / 2) * (i - 2.5) * 3 * (1 - t);
        ctx.strokeStyle = rgba(mix(C.sphere, C.strain, t), 0.55 + 0.4 * t);
        ctx.lineWidth = Math.max(0.6, lerp(5, 0.9, t) * (0.7 + 0.3 * Math.cos(i)));
        ctx.beginPath(); ctx.moveTo(ox, oy); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
      }
    }

    // flight trail
    if (S.state === 'flying' && S.trail.length > 1) {
      for (let i = 1; i < S.trail.length; i++) {
        const a = i / S.trail.length;
        ctx.strokeStyle = rgba(C.sphere, a * 0.35 * alpha);
        ctx.lineWidth = radius * 1.4 * a;
        ctx.beginPath(); ctx.moveTo(...S.trail[i - 1]); ctx.lineTo(...S.trail[i]); ctx.stroke();
      }
    }

    // shadow
    ctx.save();
    ctx.globalAlpha = alpha * 0.35;
    ctx.fillStyle = rgba(C.fg, 0.35);
    ctx.beginPath(); ctx.ellipse(sx + radius * 0.15, sy + radius * 0.9 * scale, radius * 0.85 * scale, radius * 0.22 * scale, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // strain halo
    if (t > 0.02) {
      const halo = ctx.createRadialGradient(sx, sy, radius * 0.9, sx, sy, radius * (1.4 + t));
      halo.addColorStop(0, rgba(C.strain, 0.45 * t * alpha)); halo.addColorStop(1, rgba(C.strain, 0));
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(sx, sy, radius * (1.4 + t), 0, Math.PI * 2); ctx.fill();
    }

    // sphere with squash & stretch along the pull
    let stretch = 1, squash = 1;
    if (S.state === 'grabbed' || S.state === 'returning') { stretch = 1 + 0.28 * t * (1 - S.R * 0.4); squash = 1 - 0.14 * t; }
    if (S.state === 'flying') { const sp = Math.hypot(S.vel.x, S.vel.y); stretch = 1 + Math.min(0.25, sp * 0.012); squash = 1 / stretch; }
    const dirA = S.state === 'flying' ? Math.atan2(S.vel.y, S.vel.x) : ang;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(sx, sy); ctx.rotate(dirA); ctx.scale(stretch * scale, squash * scale); ctx.rotate(-dirA);
    const body = mix(C.sphere, C.strain, t * 0.75);
    const g = ctx.createRadialGradient(-radius * 0.35, -radius * 0.4, radius * 0.08, 0, 0, radius);
    g.addColorStop(0, rgba(mix(C['sphere-hi'], [255, 255, 255], 0.4)));
    g.addColorStop(0.25, rgba(mix(body, C['sphere-hi'], 0.35)));
    g.addColorStop(0.75, rgba(body));
    g.addColorStop(1, rgba(mix(body, [0, 0, 0], 0.45)));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
    // rim light
    ctx.strokeStyle = rgba(C['sphere-hi'], 0.35); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, radius - 1, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    // specular
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(-radius * 0.38, -radius * 0.42, radius * 0.18, radius * 0.11, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // tension meter arc around socket (only while pulling)
    if (S.state === 'grabbed') {
      ctx.strokeStyle = rgba(mix(C.muted, C.strain, t), 0.9);
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy, sockR + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * t); ctx.stroke();
    }

    // idle breathing hint
    if (S.state === 'held' && !reduceMotion) {
      const p = (now % 2400) / 2400;
      ctx.strokeStyle = rgba(C.sphere, 0.35 * (1 - p));
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, radius * (1.05 + p * 0.6), 0, Math.PI * 2); ctx.stroke();
    }
  }

  function loop(now) {
    const dt = Math.min(50, now - last); last = now;
    step(dt); draw(now);
    requestAnimationFrame(loop);
  }

  function start(data) {
    if (data && data.freed) { freed = data.freed; $count.textContent = freed; }
    if (data && Array.isArray(data.history)) {
      history.push(...data.history.slice(-12));
      $history.innerHTML = history.map(r => `<i style="--r:${r}" title="${r}%"></i>`).join('');
    }
    spawn();
    requestAnimationFrame(t => { last = t; loop(t); });
  }
  window.claude?.hot?.snapshot?.(() => ({ freed, history: history.slice() }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
