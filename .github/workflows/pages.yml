# Publishes the html/ folder to the gh-pages branch, which GitHub Pages serves.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["html/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push html/ to gh-pages
        run: |
          git subtree split --prefix html -b gh-pages-build
          git push --force origin gh-pages-build:gh-pages
